[project]
name = "soccer-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pandas", "pyarrow", "numpy", "statsmodels", "scipy"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
line-length = 110
extend-exclude = ["*.ipynb", ".uv-cache", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
